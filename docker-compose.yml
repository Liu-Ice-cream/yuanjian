services:
  yuanjian:
    container_name: "${LD_CONTAINER_NAME:-yuanjian}"
    image: yuanjian:local
    build:
      context: .
      dockerfile: docker/default.Dockerfile
      target: linkding
    ports:
      - "${LD_HOST_BIND:-127.0.0.1}:${LD_HOST_PORT:-9090}:9090"
    volumes:
      - "${LD_HOST_DATA_DIR:-./docker-data}:/etc/linkding/data"
    env_file:
      - .env
    restart: unless-stopped
