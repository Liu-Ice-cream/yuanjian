name: Yuanjian CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - product-main

jobs:
  secret_scan:
    name: Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks and scan history
        run: |
          scanner_dir=$(mktemp -d)
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSL "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o "$scanner_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL "$base/gitleaks_8.30.1_checksums.txt" -o "$scanner_dir/checksums.txt"
          (cd "$scanner_dir" && sha256sum --check --ignore-missing checksums.txt && tar -xzf gitleaks_8.30.1_linux_x64.tar.gz)
          "$scanner_dir/gitleaks" git . --log-opts="--all" --redact --no-banner

  windows_install:
    name: Windows clean install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install from scratch
        shell: powershell
        run: ./scripts/setup-local.ps1
      - name: Verify fresh installation
        shell: powershell
        run: |
          ./scripts/start-local.ps1
          ./.venv/Scripts/python.exe scripts/check-installation.py seed --settings local_settings
          if ($LASTEXITCODE -ne 0) { throw 'Fresh installation probe failed.' }
          ./.venv/Scripts/python.exe scripts/check-local.py
          if ($LASTEXITCODE -ne 0) { throw 'Original bookmark API probe failed.' }
          ./scripts/stop-local.ps1
      - name: Repeat setup and verify retained data
        shell: powershell
        run: |
          ./scripts/setup-local.ps1
          ./scripts/start-local.ps1
          ./.venv/Scripts/python.exe scripts/check-installation.py verify --settings local_settings
          if ($LASTEXITCODE -ne 0) { throw 'Reinstallation probe failed.' }
      - name: Stop local services
        if: always()
        shell: powershell
        run: ./scripts/stop-local.ps1
      - name: Windows startup diagnostics
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem data/*.stderr.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output $_.Name
            Get-Content -LiteralPath $_.FullName -Tail 50
          }

  docker_install:
    name: Docker build and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/default.Dockerfile
          target: linkding
          tags: yuanjian:local
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure and start Compose
        run: |
          python scripts/setup-compose.py
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120
          docker compose cp scripts/check-installation.py yuanjian:/tmp/check-installation.py
          docker compose exec -T yuanjian python /tmp/check-installation.py seed --container
          docker compose exec -T yuanjian supervisorctl -c supervisord-tasks.conf status
      - name: Recreate container and verify retained data
        run: |
          docker compose down
          python scripts/setup-compose.py
          docker compose up -d --wait --wait-timeout 120
          docker compose cp scripts/check-installation.py yuanjian:/tmp/check-installation.py
          docker compose exec -T yuanjian python /tmp/check-installation.py verify --container
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Stop containers
        if: always()
        run: docker compose down

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Setup Python environment
        run: |
          uv sync
          mkdir data
      - name: Run tests
        run: |
          uv run manage.py check
          uv run manage.py makemigrations --check --dry-run
          uv run pytest bookmarks/tests research/tests -n auto
  e2e_tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Setup Python environment
        run: |
          uv sync
          uv run playwright install chromium
          mkdir data
      - name: Run build
        run: |
          npm run build
          uv run manage.py collectstatic
      - name: Run tests
        run: uv run pytest bookmarks/tests_e2e -n auto -o "python_files=e2e_test_*.py"
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/screenshots
