name: 问题反馈
description: 安装失败或使用中的可复现问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请去掉密码、令牌、数据库及私人研究内容。安全漏洞请按 SECURITY.md 私密报告。"
  - type: input
    id: version
    attributes:
      label: 源笺版本
      placeholder: v0.1.5
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境与安装方式
      description: 系统、安装方式及相关 Python/Node/Docker 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图
